
name: Build Vordoo APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36"

      - name: Set compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("Missing android/app/build.gradle")

          s = p.read_text()
          s, count = re.subn(
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'\g<1>compileSdkVersion 36',
              s
          )
          if count == 0:
              s, count = re.subn(
                  r'(?m)^(\s*)compileSdk\s+.*$',
                  r'\g<1>compileSdk 36',
                  s
              )
          if count == 0:
              raise SystemExit("Could not find compileSdk setting")
          p.write_text(s)
          print("Updated compileSdk to 36")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vordoo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

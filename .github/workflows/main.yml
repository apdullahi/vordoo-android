name: Build Vordoo APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --project-name vordoo --org app.vordoo --platforms android
          sed -i 's/android:label="[^"]*"/android:label="Vordoo"/' android/app/src/main/AndroidManifest.xml

      - name: Open PDFs from other apps
        continue-on-error: true
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="content" android:mimeType="application/pdf"/><data android:scheme="file" android:mimeType="application/pdf"/></intent-filter>'
          open(p,'w').write(s.replace('</activity>', f+'</activity>', 1))
          PY
          mkdir -p android/app/src/main/kotlin/app/vordoo/vordoo
          cp tool/MainActivity.kt android/app/src/main/kotlin/app/vordoo/vordoo/MainActivity.kt

      - name: Install Android SDK 36
        continue-on-error: true
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Set compileSdk to 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i -E 's/compileSdk(Version)?[ =]+[^ ]+/compileSdk = 36/' "$f"; fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vordoo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build release APK
        continue-on-error: true
        run: flutter build apk --release --no-shrink

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vordoo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

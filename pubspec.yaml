name: Build Vordoo APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use app files from the uploaded zip
        run: |
          for z in *.zip; do
            if [ -e "$z" ]; then unzip -o "$z" -x '.github/*' '__MACOSX/*'; fi
          done
          true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --project-name vordoo --org app.vordoo --platforms android
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Vordoo"/' android/app/src/main/AndroidManifest.xml

      - name: Open PDFs from other apps
        continue-on-error: true
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="content" android:mimeType="application/pdf"/><data android:scheme="file" android:mimeType="application/pdf"/></intent-filter>'
          open(p,'w').write(s.replace('</activity>', f+'</activity>', 1))
          PY
          mkdir -p android/app/src/main/kotlin/app/vordoo/vordoo
          cp tool/MainActivity.kt android/app/src/main/kotlin/app/vordoo/vordoo/MainActivity.kt

      - name: Install Android SDK
        continue-on-error: true
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "build-tools;33.0.1"

      - name: Set compileSdk to 35
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i -E 's/compileSdk(Version)?[ =]+[^ ]+/compileSdk = 35/' "$f"; fi
          done
          printf '\nandroid.suppressUnsupportedCompileSdk=35\n' >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Check the code
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt || true
          { echo '### Code check'; echo '```'; grep -E "error •" analyze.txt | head -30 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          { echo '### Build errors'; echo '```'; grep -E "Error|error:" build.log | head -40 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vordoo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build release APK
        continue-on-error: true
        shell: bash
        run: flutter build apk --release --no-shrink

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vordoo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
